# Single-service deployment: Express serves both the API and client/dist.
# Free plan sleeps after 15 minutes idle; the first request afterwards is slow.
services:
  - type: web
    name: staffsync
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm ci --omit=dev && cd ../client && npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: USE_MEMORY_DB
        value: "false"
      # Set to the public service URL, e.g. https://staffsync.onrender.com
      - key: CLIENT_ORIGIN
        sync: false
      # MongoDB Atlas connection string (SRV), database name included.
      - key: MONGO_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Used once, on the first boot, to create the first admin.
      # Remove the password after the account exists (or leave it; it is inert).
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_EMPLOYEE_ID
        value: ADM001
